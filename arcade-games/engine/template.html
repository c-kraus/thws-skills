<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #05051a; color: #f4f4ff; font-family: 'Courier New', Courier, monospace; padding: 8px; }
  .wrap { max-width: 660px; margin: 0 auto; }
  .screen { position: relative; border: 3px solid #ff6a00; border-radius: 6px; background: #0b0b2b; box-shadow: 0 0 18px rgba(255,106,0,.35); overflow: hidden; }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 4 / 3; image-rendering: pixelated; }
  .screen::after { content: ''; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(255,255,255,.035) 0, rgba(255,255,255,.035) 1px, transparent 1px, transparent 3px); }
  #overlay { position: absolute; inset: 0; z-index: 5; background: rgba(5,5,26,.94); overflow-y: auto; padding: 16px 20px; text-align: center; font-size: 14px; line-height: 1.45; }
  #overlay[hidden] { display: none; }
  #overlay h1 { color: #ffd400; font-size: 24px; letter-spacing: 2px; margin: 6px 0; text-transform: uppercase; text-shadow: 0 0 8px #ff6a00; }
  #overlay h2 { color: #39ff14; font-size: 24px; letter-spacing: 3px; margin: 6px 0; }
  #overlay h3 { color: #00e5ff; margin: 10px 0 4px; font-size: 14px; text-align: left; }
  #overlay .sub { color: #00e5ff; margin-bottom: 8px; }
  #overlay .big { color: #ffd400; font-size: 20px; margin: 6px 0; }
  #overlay p { margin: 6px 0; }
  #overlay ul { text-align: left; margin: 4px 0 8px 18px; font-size: 13px; }
  #overlay li { margin: 6px 0; }
  #overlay .rules { text-align: left; display: inline-block; max-width: 520px; color: #d8d8ff; font-size: 13px; }
  #overlay .rules li { margin: 3px 0; }
  .btn { font-family: inherit; font-weight: bold; font-size: 16px; letter-spacing: 2px; background: #ffd400; color: #1a1a1a; border: 3px solid #ff6a00; padding: 8px 20px; cursor: pointer; border-radius: 4px; }
  .btn:hover, .btn:focus { background: #39ff14; outline: 3px solid #00e5ff; }
  .btn.alt { background: #1a1a55; color: #f4f4ff; border-color: #00e5ff; }
  #msg { min-height: 64px; margin-top: 8px; padding: 8px 10px; font-size: 14px; line-height: 1.4; border-left: 5px solid #8a8ac0; background: #0b0b2b; color: #f4f4ff; }
  #msg.good { border-color: #39ff14; } #msg.bad { border-color: #ff3355; } #msg.info { border-color: #00e5ff; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; margin-top: 8px; }
  .tog { font-family: inherit; font-size: 12px; background: #1a1a55; color: #f4f4ff; border: 2px solid #8a8ac0; padding: 5px 9px; cursor: pointer; border-radius: 4px; }
  .tog:hover, .tog:focus { border-color: #00e5ff; outline: none; }
  .pad { display: flex; justify-content: center; gap: 10px; margin-top: 8px; }
  .pad button { font-family: inherit; font-size: 20px; font-weight: bold; width: 74px; height: 50px; background: #ff6a00; color: #fff; border: 3px solid #ffd400; border-radius: 8px; cursor: pointer; user-select: none; -webkit-user-select: none; touch-action: none; }
  .pad button:active { background: #ffd400; color: #111; }
  .hint { font-size: 11px; color: #8a8ac0; margin-top: 6px; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <div class="screen">
    <canvas id="cv" width="640" height="480" role="img" aria-label="{{TITLE}} game board"></canvas>
    <div id="overlay"></div>
  </div>
  <div id="msg" role="status" aria-live="polite">Feedback appears here after every move.</div>
  <div class="pad" aria-label="On-screen controls">{{PAD}}</div>
  <div class="bar">
    <button class="tog" id="muteBtn">🔇 Sound off</button>
    <button class="tog" id="slowBtn">🐢 Slow mode: off</button>
  </div>
  <div class="hint">{{KEYS}} · P = pause</div>
</div>
<script>
{{DATA}}
{{CORE}}
{{GAME}}
boot();
</script>
</body>
</html>
